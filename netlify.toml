[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Rebuild only when the site or the figure JSON changed. Data commits are
  # always followed by a figures commit (plots.yml writes out/figures/manifest.json),
  # so the site is built once, with tables and plots in sync.
  ignore = "git diff --quiet HEAD^ HEAD -- . ../out/figures ../config.yaml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
