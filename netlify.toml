[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Rebuild only when the site, the data or the figure JSON changed.
  ignore = "git diff --quiet HEAD^ HEAD -- . ../data ../out/figures ../config.yaml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
